# Cloudflare sets CF-Connecting-IP. Requests reach nginx only through the tunnel or the host's
# loopback port, so this is the real client address, and any X-Real-IP from a client is overwritten.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $client_ip zone=login:5m rate=2r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 30m;
    include /etc/nginx/snippets/security-headers.conf;

    # Docker's embedded DNS, so nginx starts even if the API is not up yet.
    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /api/auth/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
    }

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_read_timeout 120s;
    }
}
